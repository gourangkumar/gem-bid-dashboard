<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProcMart Bid Eligibility Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F8;
    --surface:#FFFFFF;
    --surface-2:#FAFBFC;
    --ink:#131C31;
    --ink-soft:#33415A;
    --muted:#6B7686;
    --line:#E4E8EE;
    --line-strong:#CBD2DC;

    --go:#0E7C6B;
    --go-bg:#E4F5F1;
    --go-line:#B6E3D8;

    --review:#B4790F;
    --review-bg:#FCF1DD;
    --review-line:#F0D89E;

    --issue:#B33A3A;
    --issue-bg:#FBE9E7;
    --issue-line:#EFC0BB;

    --closed:#8992A1;
    --closed-bg:#EEF0F3;
    --closed-line:#DADFE5;

    --accent:#1D4E89;
    --accent-soft:#E7EEF6;

    --radius:10px;
    --shadow: 0 1px 2px rgba(19,28,49,0.04), 0 6px 20px -8px rgba(19,28,49,0.10);
    font-size:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  h1,h2,h3,.display{font-family:'Space Grotesk', sans-serif;}

  a{color:var(--accent);}

  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(180deg, #101B30 0%, #16233D 100%);
    color:#fff;
    padding:26px 32px 22px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; right:-40px; top:-60px;
    width:280px; height:280px;
    background: radial-gradient(circle at center, rgba(29,78,137,0.55), transparent 70%);
    pointer-events:none;
  }
  .top-inner{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:24px; position:relative; z-index:1; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:16px;}
  .gate-mark{display:flex; gap:5px; align-items:flex-end;}
  .gate-mark span{
    display:block; width:9px; border-radius:2px;
    background:var(--go);
  }
  .gate-mark span:nth-child(1){height:26px; background:var(--go);}
  .gate-mark span:nth-child(2){height:38px; background:var(--review);}
  .gate-mark span:nth-child(3){height:20px; background:var(--issue);}
  .brand h1{font-size:22px; font-weight:700; margin:0; letter-spacing:0.2px;}
  .brand .tag{font-size:12.5px; color:#9FB0CB; margin-top:3px; font-family:'IBM Plex Mono',monospace;}
  .meta{
    text-align:right; font-size:12.5px; color:#9FB0CB;
    font-family:'IBM Plex Mono', monospace; line-height:1.7;
  }
  .meta b{color:#EAF0FA; font-weight:600;}

  /* ---------- KPI Strip ---------- */
  .kpi-strip{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:10px;
    padding:18px 32px 0; margin-top:-10px; position:relative; z-index:2;
  }
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
    position:relative;
  }
  .kpi:hover{transform:translateY(-2px); border-color:var(--line-strong);}
  .kpi.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), var(--shadow);}
  .kpi .val{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; line-height:1;}
  .kpi .lbl{font-size:11.5px; color:var(--muted); margin-top:6px; font-weight:500; letter-spacing:.2px;}
  .kpi .bar{position:absolute; left:0; bottom:0; height:3px; width:100%; border-radius:0 0 var(--radius) var(--radius);}

  /* ---------- Controls ---------- */
  .controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:18px 32px 0;
  }
  .search-wrap{
    position:relative; flex:1 1 260px; min-width:220px;
  }
  .search-wrap input{
    width:100%; padding:10px 14px 10px 36px; border-radius:8px; border:1px solid var(--line-strong);
    font-family:'IBM Plex Sans'; font-size:13.5px; background:var(--surface); color:var(--ink);
  }
  .search-wrap input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45;}

  select{
    padding:10px 12px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); font-family:'IBM Plex Sans'; font-size:13.5px; color:var(--ink-soft);
    cursor:pointer;
  }
  select:focus{outline:none; border-color:var(--accent);}

  .chip{
    padding:8px 13px; border-radius:20px; border:1px solid var(--line-strong);
    font-size:12.5px; font-weight:500; color:var(--ink-soft); background:var(--surface);
    cursor:pointer; white-space:nowrap; transition:all .12s ease; user-select:none;
  }
  .chip:hover{border-color:var(--line-strong); background:var(--surface-2);}
  .chip.on{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }
  .chip-group{display:flex; gap:7px; flex-wrap:wrap;}

  .toggle-pill{
    display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:20px;
    border:1px solid var(--line-strong); background:var(--surface); font-size:12.5px; cursor:pointer;
    color:var(--ink-soft); user-select:none;
  }
  .toggle-pill input{accent-color:var(--accent);}

  .right-controls{margin-left:auto; display:flex; gap:10px; align-items:center;}

  /* ---------- Insights ---------- */
  .insights{
    display:grid; grid-template-columns: 1.1fr 1.4fr; gap:14px;
    padding:16px 32px 0;
  }
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .panel h3{font-size:13px; margin:0 0 10px; color:var(--ink-soft); font-weight:600; letter-spacing:.2px;
    display:flex; align-items:center; justify-content:space-between;}
  .panel h3 .n{font-family:'IBM Plex Mono'; font-weight:400; color:var(--muted); font-size:11.5px;}

  /* ---------- Table ---------- */
  .table-wrap{
    margin:16px 32px 40px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); overflow:visible;
  }
  .table-scroll{overflow-x:auto; overflow-y:clip;}
  table{border-collapse:collapse; width:100%; min-width:1180px;}
  thead th{
    position:sticky; top:0; background:var(--surface-2); z-index:20;
    box-shadow:0 1px 0 var(--line);
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--line);
    cursor:pointer; white-space:nowrap;
  }
  thead th:hover{color:var(--ink-soft);}
  thead th .arrow{font-size:9px; margin-left:3px; opacity:.5;}
  tbody td{
    padding:11px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top;
    color:var(--ink-soft);
  }
  tbody tr{cursor:pointer; transition:background .1s ease;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}

  .bidno{font-family:'IBM Plex Mono'; font-size:12px; color:var(--ink); font-weight:500;}
  .title-cell{max-width:280px;}
  .eligibility-cell{width:210px; min-width:190px; max-width:230px; white-space:normal; line-height:1.45; word-break:normal; overflow-wrap:anywhere;}
  .eligibility-cell .elig-item{display:inline;}
  .title-cell .t{color:var(--ink); font-weight:500; font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .dept-cell{max-width:150px; font-size:12px;}
  .type-badge{
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:4px;
    background:var(--accent-soft); color:var(--accent); font-family:'IBM Plex Mono';
  }
  .days-cell{font-family:'IBM Plex Mono'; font-size:12.5px;}
  .days-cell.urgent{color:var(--issue); font-weight:600;}
  .days-cell.soon{color:var(--review); font-weight:600;}
  .days-cell.past{color:var(--closed);}

  .gate{display:flex; gap:3px; margin-bottom:5px;}
  .gate span{width:16px; height:6px; border-radius:2px; background:var(--line-strong);}
  .gate span.g{background:var(--go);}
  .gate span.r{background:var(--review);}
  .gate span.x{background:var(--issue);}

  .rec-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:6px; white-space:nowrap;
  }
  .rec-badge.go{background:var(--go-bg); color:var(--go); border:1px solid var(--go-line);}
  .rec-badge.review{background:var(--review-bg); color:var(--review); border:1px solid var(--review-line);}
  .rec-badge.issues{background:var(--issue-bg); color:var(--issue); border:1px solid var(--issue-line);}

  .empty-row td{text-align:center; padding:50px 20px; color:var(--muted); font-size:13.5px;}

  .table-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; font-size:12px; color:var(--muted); border-top:1px solid var(--line);
    background:var(--surface-2);
  }

  /* ---------- Drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(15,21,35,0.45); opacity:0; pointer-events:none;
    transition:opacity .18s ease; z-index:1000;
  }
  .scrim.on{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:480px; max-width:92vw;
    background:var(--surface); z-index:1001; box-shadow:-16px 0 40px rgba(15,21,35,0.18);
    transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  .drawer.on{transform:translateX(0);}
  .drawer-head{
    padding:20px 22px 16px; border-bottom:1px solid var(--line); position:relative;
    background:var(--surface-2);
  }
  .drawer-close{
    position:absolute; right:16px; top:16px; width:30px; height:30px; border-radius:8px;
    border:1px solid var(--line-strong); background:var(--surface); cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .drawer-close:hover{background:var(--surface-2);}
  .drawer-head .bidno{font-size:13px;}
  .drawer-head h2{font-size:16px; margin:8px 0 4px; line-height:1.35; font-family:'IBM Plex Sans'; font-weight:600;}
  .drawer-head .dept-line{font-size:12px; color:var(--muted);}
  .drawer-body{padding:18px 22px 30px; overflow-y:auto; flex:1;}
  .dsec{margin-bottom:20px;}
  .dsec h4{
    font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    margin:0 0 10px; font-weight:600;
  }
  .dgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .dfield{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:9px 11px;}
  .dfield .k{font-size:10.5px; color:var(--muted); margin-bottom:3px;}
  .dfield .v{font-size:12.5px; color:var(--ink); font-weight:500; line-height:1.4; word-break:break-word;}

  .elig-source{
    font-size:10.5px;
    color:var(--muted);
    margin:-4px 0 10px;
    font-family:'IBM Plex Mono',monospace;
  }
  .elig-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  .elig-field{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
  }
  .elig-field .k{
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:4px;
    font-weight:600;
  }
  .elig-field .v{
    font-size:12.5px;
    color:var(--ink);
    font-weight:500;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .raw-elig{
    margin-top:10px;
  }
  .raw-elig summary{
    cursor:pointer;
    color:var(--accent);
    font-size:11.5px;
    font-weight:600;
  }
  .raw-elig pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:11.5px;
    line-height:1.5;
    color:var(--ink-soft);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    margin:8px 0 0;
  }
  @media (max-width:640px){
    .drawer{width:100%;max-width:100vw;}
  }
  .dnote{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:11px 12px;
    font-size:12.5px; line-height:1.55; color:var(--ink-soft);
  }
  .rec-callout{
    border-radius:10px; padding:12px 14px; font-size:13px; font-weight:600; display:flex; gap:8px; align-items:center;
  }
  .btn-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:10px 14px;
    background:var(--ink); color:#fff; text-decoration:none; border-radius:8px; font-size:12.5px; font-weight:500;
  }
  .btn-link:hover{background:#0A1524;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}


  /* ---------- Fixed dashboard + table header ---------- */
  /* The four visible bands stack naturally and stay pinned during page scroll. */
  header.top{
    position:sticky;
    top:0;
    z-index:100;
  }
  .kpi-strip{
    position:sticky;
    top:var(--top-h, 0px);
    z-index:90;
    background:var(--bg);
    padding-bottom:0;
  }
  .controls{
    position:sticky;
    top:var(--kpi-top, 0px);
    z-index:80;
    background:var(--bg);
    padding-bottom:18px;
  }
  .table-wrap{
    position:relative;
    overflow:visible;
  }
  /* Keep horizontal scrolling, but let the page own vertical scrolling so the
     table header can stick to the viewport reliably. */
  .table-scroll{overflow:visible;}
  thead th{
    position:sticky;
    top:var(--table-head-top, 0px);
    z-index:70;
    background:var(--surface-2);
  }
  th[data-key="eligibility_summary"], td.eligibility-checks-cell{
    width:210px; min-width:210px; max-width:210px;
  }
  td.eligibility-checks-cell{white-space:normal; overflow-wrap:anywhere; word-break:break-word;}

  @media (max-width: 1000px){
    .kpi-strip{grid-template-columns:repeat(3,1fr);}
    .insights{grid-template-columns:1fr;}
  }
  @media (max-width: 640px){
    header.top{padding:20px;}
    .kpi-strip, .controls{padding-left:16px; padding-right:16px;}
    .table-wrap{margin:16px;}
    .kpi-strip{grid-template-columns:repeat(2,1fr);}
  }

  /* Drawer must always render above every sticky dashboard band and table header */
  .scrim{z-index:1000 !important;}
  .drawer{z-index:1001 !important;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="gate-mark"><span></span><span></span><span></span></div>
      <div>
        <h1>ProcMart Bid Eligibility Console</h1>
        <div class="tag">GeM Phase-1 Screening &middot; Full BidDoc + ChildDoc + ProcMart Eligibility</div>
      </div>
    </div>
    <div class="meta">
      Snapshot <b id="snapDate">14 Aug 2026</b><br>
      Source <b>GeM Bid Tracker</b><br>
      <span id="metaTotal">161</span> bids tracked
    </div>
  </div>
</header>

<div class="kpi-strip" id="kpiStrip"></div>

<div class="controls">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchBox" placeholder="Search bid no, title, or department…">
  </div>
  <select id="deptFilter"><option value="">All Departments</option></select>
  <div class="right-controls">
    <label class="toggle-pill"><input type="checkbox" id="hideClosedToggle" checked> Hide already-closed</label>
    <select id="sortSelect">
      <option value="days_left-asc">Sort: Days Left (soonest)</option>
      <option value="rec-asc">Sort: Recommendation</option>
      <option value="value-desc">Sort: Value (high→low)</option>
      <option value="value-asc">Sort: Value (low→high)</option>
      <option value="bid_no-asc">Sort: Bid No (A→Z)</option>
    </select>
  </div>
</div>

<div class="table-wrap">
  <div class="table-scroll">
    <table>
      <thead>
        <tr id="tableHead"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <span id="footerCount">Showing 0 of 0</span>
    <span>Click any row for full eligibility detail</span>
  </div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"></div>

<script>
  const SPREADSHEET_ID = '1BiZSN_TvhyNfX2aa4G9qucCs1GLxpbsPCWoKnsFuF4s';

  // Helper to format date as YYYY-MM-DD
  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // Get D-1 (Yesterday's date)
  function getDMinusOneTabName() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return formatDate(d);
  }

  async function fetchSheetData(tabName) {
    // Google Sheets Visualization API JSON endpoint
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${tabName}`;

    try {
      const response = await fetch(url);
      const text = await response.text();

      // Extract JSON payload from Google's wrap callback wrapper
      const jsonString = text.substring(47, text.length - 2);
      const data = JSON.parse(jsonString);

      if (data.status === 'error') {
        throw new Error(data.errors[0].detailed_message || 'Tab not found');
      }

      return parseGvizData(data);
    } catch (error) {
      console.warn(`Failed to fetch tab ${tabName}:`, error);
      return null;
    }
  }

  // Convert Google's gviz table output into standard JSON array of objects
  function parseGvizData(gvizData) {
    const cols = gvizData.table.cols.map(col => col.label || col.id);
    return gvizData.table.rows.map(row => {
      const rowObj = {};
      row.c.forEach((cell, idx) => {
        const key = cols[idx];
        if (key) {
          rowObj[key] = cell ? (cell.v !== null ? cell.v : cell.f) : null;
        }
      });
      return rowObj;
    });
  }

  // Primary loader with fallback to today's date if D-1 tab doesn't exist
  async function loadDashboardData() {
    const dMinusOneTab = getDMinusOneTabName(); // e.g. "2026-08-16"
    let data = await fetchSheetData(dMinusOneTab);

    // Optional Fallback: If D-1 tab isn't created yet, try today's tab
    if (!data) {
      const todayTab = formatDate(new Date());
      console.log(`Fallback: Attempting to fetch today's tab (${todayTab})`);
      data = await fetchSheetData(todayTab);
    }

    if (data) {
      // Pass formatted dataset into your existing dashboard render function
      renderDashboard(data); 
    } else {
      console.error('Could not load data for D-1 or Today.');
    }
  }

  document.addEventListener('DOMContentLoaded', loadDashboardData);
</script>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('bid-data').textContent);
  const TODAY_LABEL = '14 Aug 2026';

  const COLORS = { go:'#0E7C6B', review:'#B4790F', issues:'#B33A3A', closed:'#8992A1', accent:'#1D4E89' };

  // ---------- derive fields ----------
  DATA.forEach(d=>{
    d.recGroup = d.rec === 'GO' ? 'GO' : (d.rec === 'MULTIPLE ISSUES' ? 'ISSUES' : 'REVIEW');
    d.isPast = d.days_left !== null && d.days_left < 0;
    d.isUrgent = d.days_left !== null && d.days_left >= 0 && d.days_left <= 3;
    d.isSoon = d.days_left !== null && d.days_left > 3 && d.days_left <= 7;
  });

  const state = {
    search:'', dept:'', recFilter:null, hideClosed:true,
    sort:'days_left-asc', kpiFilter:null
  };

  // ---------- KPI definitions ----------
  const totalN = DATA.length;
  const goN = DATA.filter(d=>d.rec==='GO').length;
  const reviewN = DATA.filter(d=>d.recGroup==='REVIEW').length;
  const issuesN = DATA.filter(d=>d.recGroup==='ISSUES').length;
  const openN = DATA.filter(d=>!d.isPast);
  const urgentN = openN.filter(d=>d.isUrgent).length;
  const oemN = DATA.filter(d=>d.oem_flag==='Yes').length;

  const kpis = [
    {key:'all', label:'Total Bids', val: totalN, color: COLORS.accent},
    {key:'go', label:'Ready to Process (GO)', val: goN, color: COLORS.go},
    {key:'review', label:'Needs Review', val: reviewN, color: COLORS.review},
    {key:'issues', label:'Multiple Issues', val: issuesN, color: COLORS.issues},
    {key:'urgent', label:'Closing ≤ 3 Days (Open)', val: urgentN, color: COLORS.issues},
    {key:'oem', label:'OEM Authorization Required', val: oemN, color: COLORS.review},
  ];

  const kpiStrip = document.getElementById('kpiStrip');
  kpis.forEach(k=>{
    const el = document.createElement('div');
    el.className='kpi';
    el.dataset.key = k.key;
    el.innerHTML = `<div class="val" style="color:${k.color}">${k.val}</div><div class="lbl">${k.label}</div><div class="bar" style="background:${k.color}"></div>`;
    el.addEventListener('click', ()=>{
      state.kpiFilter = (state.kpiFilter === k.key) ? null : k.key;
      document.querySelectorAll('.kpi').forEach(x=>x.classList.remove('active'));
      if(state.kpiFilter) el.classList.add('active');
      render();
    });
    kpiStrip.appendChild(el);
  });

  // ---------- department dropdown ----------
  const deptSel = document.getElementById('deptFilter');
  const deptCounts = {};
  DATA.forEach(d=>{ deptCounts[d.dept] = (deptCounts[d.dept]||0)+1; });
  Object.keys(deptCounts).sort((a,b)=>deptCounts[b]-deptCounts[a]).forEach(dep=>{
    const o = document.createElement('option');
    o.value = dep; o.textContent = `${dep} (${deptCounts[dep]})`;
    deptSel.appendChild(o);
  });
  deptSel.addEventListener('change', ()=>{ state.dept = deptSel.value; render(); });

  // ---------- search ----------
  const searchBox = document.getElementById('searchBox');
  searchBox.addEventListener('input', ()=>{ state.search = searchBox.value.trim().toLowerCase(); render(); });


  // ---------- table ----------
  const columns = [
    {key:'gate', label:'Gate', sortable:false},
    {key:'bid_no', label:'Bid No', sortable:true},
    {key:'title', label:'Title', sortable:false},
    {key:'dept', label:'Department', sortable:true},
    {key:'value', label:'Value (INR)', sortable:true},
    {key:'days_left', label:'Days Left', sortable:true},
    {key:'turnover_status', label:'Turnover', sortable:false},
    {key:'reseller_status', label:'Reseller', sortable:false},
    {key:'child_flag', label:'Child Doc', sortable:false},
    {key:'eligibility_summary', label:'Eligibility Checks', sortable:false},
    {key:'rec', label:'Recommendation', sortable:true},
  ];
  const thead = document.getElementById('tableHead');
  columns.forEach(c=>{
    const th = document.createElement('th');
    th.textContent = c.label;
    if(c.sortable){
      th.addEventListener('click', ()=>{
        const [curKey, curDir] = state.sort.split('-');
        const newDir = (curKey===c.key && curDir==='asc') ? 'desc' : 'asc';
        state.sort = `${c.key}-${newDir}`;
        sortSelect.value = ['days_left-asc','rec-asc','value-desc','value-asc','bid_no-asc'].includes(state.sort) ? state.sort : sortSelect.value;
        render();
      });
    }
    thead.appendChild(th);
  });

  const tbody = document.getElementById('tableBody');
  const footerCount = document.getElementById('footerCount');

  function fmtINR(v){
    if(v===null || v===undefined || isNaN(v)) return '—';
    return '₹' + Math.round(v).toLocaleString('en-IN');
  }

  function gateCellHTML(d){
    const seg = (ok, warnClass)=> ok ? '<span class="g"></span>' : `<span class="${warnClass}"></span>`;
    const turnoverOK = d.turnover_status.startsWith('MET');
    const resellerOK = d.reseller_status.startsWith('MET');
    const childOK = d.child_flag !== 'Additional Reqs Found';
    return `<div class="gate">
      ${turnoverOK? '<span class="g"></span>' : '<span class="x"></span>'}
      ${resellerOK? '<span class="g"></span>' : '<span class="r"></span>'}
      ${childOK? '<span class="g"></span>' : '<span class="r"></span>'}
    </div>`;
  }

  function recBadgeHTML(d){
    const cls = d.recGroup==='GO' ? 'go' : (d.recGroup==='ISSUES' ? 'issues' : 'review');
    return `<span class="rec-badge ${cls}">${d.rec}</span>`;
  }

  function daysCellHTML(d){
    if(d.days_left===null) return '<span class="days-cell">—</span>';
    let cls = '';
    if(d.isPast) cls='past';
    else if(d.isUrgent) cls='urgent';
    else if(d.isSoon) cls='soon';
    const label = d.isPast ? `${Math.abs(d.days_left)}d ago` : `${d.days_left}d`;
    return `<span class="days-cell ${cls}">${label}</span>`;
  }

  function applyFilters(){
    return DATA.filter(d=>{
      if(state.hideClosed && d.isPast) return false;
      if(state.dept && d.dept!==state.dept) return false;
      if(state.search){
        const hay = (d.bid_no+' '+d.title+' '+d.dept).toLowerCase();
        if(!hay.includes(state.search)) return false;
      }
      if(state.kpiFilter){
        if(state.kpiFilter==='go' && d.recGroup!=='GO') return false;
        if(state.kpiFilter==='review' && d.recGroup!=='REVIEW') return false;
        if(state.kpiFilter==='issues' && d.recGroup!=='ISSUES') return false;
        if(state.kpiFilter==='urgent' && !(d.isUrgent && !d.isPast)) return false;
        if(state.kpiFilter==='oem' && d.oem_flag!=='Yes') return false;
      }
      return true;
    });
  }

  function applySort(list){
    const [key, dir] = state.sort.split('-');
    const mul = dir==='asc' ? 1 : -1;
    const recOrder = {'GO':0};
    list.sort((a,b)=>{
      let av, bv;
      if(key==='days_left'){
        av = a.days_left===null ? 9999 : a.days_left;
        bv = b.days_left===null ? 9999 : b.days_left;
      } else if(key==='value'){
        av = (a.value===null||a.value===undefined) ? -1 : a.value;
        bv = (b.value===null||b.value===undefined) ? -1 : b.value;
      } else if(key==='rec'){
        const rank = d => d.recGroup==='ISSUES'?0:(d.recGroup==='REVIEW'?1:2);
        av = rank(a); bv = rank(b);
      } else {
        av = (a[key]||'').toString().toLowerCase();
        bv = (b[key]||'').toString().toLowerCase();
      }
      if(av<bv) return -1*mul;
      if(av>bv) return 1*mul;
      return 0;
    });
    return list;
  }

  function render(){
    let list = applyFilters();
    list = applySort(list.slice());
    tbody.innerHTML='';
    if(list.length===0){
      tbody.innerHTML = `<tr class="empty-row"><td colspan="${columns.length}">No bids match the current filters.</td></tr>`;
    } else {
      list.forEach(d=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${gateCellHTML(d)}</td>
          <td class="bidno">${d.bid_no}</td>
          <td class="title-cell"><div class="t">${escapeHTML(d.title)}</div></td>
          <td class="dept-cell">${escapeHTML(d.dept)}</td>
          <td class="mono">${fmtINR(d.value)}</td>
          <td>${daysCellHTML(d)}</td>
          <td style="font-size:11.5px">${escapeHTML(d.turnover_status)}</td>
          <td style="font-size:11.5px">${escapeHTML(d.reseller_status)}</td>
          <td style="font-size:11.5px">${escapeHTML(d.child_flag)}</td>
          <td class="eligibility-cell" style="font-size:11.5px">
            ${[
              ...(d.bid_doc_fields || []),
              ...(d.child_doc_fields || []),
              ...(d.procmart_fields || [])
            ].map(f => escapeHTML(f.label)).join(' · ')}
          </td>
          <td>${recBadgeHTML(d)}</td>
        `;
        tr.addEventListener('click', ()=>openDrawer(d));
        tbody.appendChild(tr);
      });
    }
    footerCount.textContent = `Showing ${list.length} of ${totalN}`;
  }

  function escapeHTML(s){
    if(s===null||s===undefined) return '';
    return s.toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ---------- drawer ----------
  const scrim = document.getElementById('scrim');
  const drawer = document.getElementById('drawer');

  function recCalloutHTML(d){
    const cls = d.recGroup==='GO' ? 'go' : (d.recGroup==='ISSUES'?'issues':'review');
    const bg = cls==='go'? 'var(--go-bg)' : cls==='issues' ? 'var(--issue-bg)' : 'var(--review-bg)';
    const col = cls==='go'? 'var(--go)' : cls==='issues' ? 'var(--issue)' : 'var(--review)';
    const border = cls==='go'? 'var(--go-line)' : cls==='issues' ? 'var(--issue-line)' : 'var(--review-line)';
    return `<div class="rec-callout" style="background:${bg};color:${col};border:1px solid ${border}">${gateCellHTML(d)} ${d.rec}</div>`;
  }

  function eligibilityFieldsHTML(fields){
    if(!fields || !fields.length){
      return `<div class="dnote">No structured eligibility fields found.</div>`;
    }
    return `<div class="elig-grid">` +
      fields.map(f => `
        <div class="elig-field">
          <div class="k">${escapeHTML(f.label)}</div>
          <div class="v">${escapeHTML(f.value)}</div>
        </div>
      `).join('') +
      `</div>`;
  }

  function eligibilitySectionHTML(title, sourceName, fields, rawText){
    return `
      <div class="dsec">
        <h4>${escapeHTML(title)}</h4>
        <div class="elig-source">${escapeHTML(sourceName)} · ${fields ? fields.length : 0} fields detected</div>
        ${eligibilityFieldsHTML(fields)}
        ${rawText && rawText !== '-' ? `
          <details class="raw-elig">
            <summary>Show complete extracted text</summary>
            <pre>${escapeHTML(rawText)}</pre>
          </details>
        ` : ''}
      </div>
    `;
  }

  function openDrawer(d){
    drawer.innerHTML = `
      <div class="drawer-head">
        <button class="drawer-close" id="drawerClose">✕</button>
        <div class="bidno mono">${escapeHTML(d.bid_no)}</div>
        <h2>${escapeHTML(d.title)}</h2>
        <div class="dept-line">${escapeHTML(d.dept)} &middot; Value ${fmtINR(d.value)} &middot; Closes ${escapeHTML(d.end_date_disp)}</div>
      </div>

      <div class="drawer-body">
        <div class="dsec">${recCalloutHTML(d)}</div>

        ${eligibilitySectionHTML(
          'Bid document eligibility',
          'BidDoc_eligibility',
          d.bid_doc_fields || [],
          d.bid_doc_fields_raw || ''
        )}

        ${eligibilitySectionHTML(
          'Child / nested document eligibility',
          'ChildDoc_eligibility',
          d.child_doc_fields || [],
          d.child_doc_fields_raw || ''
        )}

        ${eligibilitySectionHTML(
          'ProcMart eligibility check',
          'Procmart_eligibility',
          d.procmart_fields || [],
          d.procmart_fields_raw || ''
        )}

        <div class="dsec">
          <h4>Screening outcome</h4>
          <div class="dgrid">
            <div class="dfield">
              <div class="k">Recommendation</div>
              <div class="v">${escapeHTML(d.rec)}</div>
            </div>
            <div class="dfield">
              <div class="k">Child Document Flag</div>
              <div class="v">${escapeHTML(d.child_flag)}</div>
            </div>
          </div>
          ${Array.isArray(d.issues) && d.issues.length ? `
            <div class="dnote" style="margin-top:10px">
              <b>Issues:</b> ${escapeHTML(d.issues.join(' · '))}
            </div>
          ` : ''}
        </div>

        ${d.bid_url ? `<a class="btn-link" href="${escapeHTML(d.bid_url)}" target="_blank" rel="noopener">Open Bid Document ↗</a>` : ''}
      </div>
    `;
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    scrim.classList.add('on');
    drawer.classList.add('on');
  }

  function closeDrawer(){
    scrim.classList.remove('on');
    drawer.classList.remove('on');
  }
  scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

  render();
})();

</script>


<script>
(function(){
  function updateStickyOffsets(){
    const top = document.querySelector('header.top');
    const kpi = document.querySelector('.kpi-strip');
    const controls = document.querySelector('.controls');
    if(!top || !kpi || !controls) return;
    const topH = top.getBoundingClientRect().height;
    const kpiH = kpi.getBoundingClientRect().height;
    const controlsH = controls.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--top-h', topH + 'px');
    document.documentElement.style.setProperty('--kpi-top', (topH + kpiH) + 'px');
    document.documentElement.style.setProperty('--table-head-top', (topH + kpiH + controlsH) + 'px');
  }
  window.addEventListener('load', updateStickyOffsets);
  window.addEventListener('resize', updateStickyOffsets);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateStickyOffsets);
  setTimeout(updateStickyOffsets, 100);
})();
</script>
</body>
</html>
